<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px system-ui, sans-serif; width: 360px; margin: 0; padding: 12px; color: #202124; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    ul { list-style: none; padding: 0; margin: 0 0 10px; max-height: 320px; overflow-y: auto; }
    li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #eee; }
    .info { flex: 1; min-width: 0; }
    .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
    .meta { color: #5f6368; font-size: 11px; }
    button { font: inherit; padding: 5px 10px; border: 1px solid #dadce0; border-radius: 4px; background: #fff; cursor: pointer; }
    button:hover { background: #f1f3f4; }
    button.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
    button.primary:hover { background: #1765cc; }
    .row { display: flex; gap: 8px; }
    .row button { flex: 1; }
    .empty { color: #5f6368; margin: 0 0 10px; line-height: 1.4; }
    #status { margin-top: 8px; color: #5f6368; min-height: 1em; }
  </style>
</head>
<body>
  <h1>PDF Grabber</h1>
  <ul id="list"></ul>
  <p id="empty" class="empty" hidden>
    No PDFs seen on this tab yet. Open the PDF, or <b>reload the page</b>
    (PDFs loaded before the extension was installed aren't caught).
  </p>
  <div class="row">
    <button id="all" class="primary">Download all</button>
    <button id="viewer" title="Pulls the PDF straight out of a PDF.js viewer on this page">Grab from viewer</button>
  </div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
